{{ include "store-pos.deployment" (list . "till") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prices
data:
  prices.json: {{ toJson .Values.prices | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: till
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: till, port: {name: http}}}

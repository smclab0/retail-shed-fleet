name: store-pos image
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/image.yaml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from app/VERSION
        id: v
        run: echo "version=$(cat app/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/store-pos:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/store-pos:sha-${{ github.sha }}
